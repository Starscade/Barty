			--bart-white: #ffffff;
			font-weight: bold;
			height: 100%;
			-webkit-tap-highlight-color: transparent;
		}

		* {
			box-sizing: border-box;
		}

		body,
		.container {
			height: 100%;
			margin: 0;
		}

		body {
			background: var(--bart-bg);
			color: var(--bart-black);
			display: flex;
			flex-direction: column;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
				Arial, sans-serif;
			margin: 0;
			padding: 0;
		}

		.btn-location {
			align-items: center;
			background: var(--bart-blue);
			border: none;
			color: white;
			cursor: pointer;
			display: flex;
			font-weight: bold;
			height: 46px;
			justify-content: center;
			position: relative;
			transition: background 0.2s;
			width: 100%;
		}

		.btn-location:active {
			background: var(--bart-blue-dark);
		}

		.btn-location:disabled {
			background: var(--bart-blue-dark);
			cursor: not-allowed;
		}

		.card-row {
			align-items: center;
			background: var(--bart-white);
			border-left: 12px solid var(--bart-gray-medium);
			border-radius: 8px;
			box-shadow: 0 2px 2px #00000011;
			display: flex;
			margin-bottom: 10px;
			min-height: 56px;
			overflow: hidden;
		}

		.container {
			display: flex;
			flex-direction: column;
			height: 100%;
			margin: 0 auto;
			overflow: hidden;
			width: 100%;
			position: relative;
		}

		.controls {
			background: black;
			border-top: 4px solid var(--bart-blue);
			display: flex;
			flex-direction: column;
			flex-shrink: 0;
			gap: 10px;
			padding: 15px;
			z-index: 10;
		}

		.est-pill {
			font-size: 0.85rem;
			min-width: 40px;
			padding: 4px 8px;
			text-align: center;
		}

		.est-pill.leaving {
			animation: blink 1.5s infinite;
			color: var(--bart-blue);
		}

		.line-dest {
			border-right: 1px solid var(--bart-gray-light);
			flex: 1;
			font-size: 1rem;
			overflow: hidden;
			padding: 12px;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.line-estimates {
			display: flex;
			flex-wrap: wrap;
			justify-content: flex-end;
			padding: 12px;
		}

		#departures-container {
			flex: 1;
			min-height: 0;
			overflow-y: auto;
			padding: 15px;
			position: relative;
		}

		.skeleton-card {
			background: var(--bart-gray-medium);
			overflow: hidden;
			position: relative;
		}

		.skeleton-card::after {
			animation: shimmer 2s infinite;
			background-image: linear-gradient(
				90deg,
				rgba(255, 255, 255, 0) 0,
				rgba(255, 255, 255, 0.6) 50%,
				rgba(255, 255, 255, 0) 100%
			);
			bottom: 0;
			content: "";
			left: 0;
			position: absolute;
			right: 0;
			top: 0;
			transform: translateX(-100%);
		}

		.slider {
			background-color: var(--bart-gray-medium);
			bottom: 0;
			cursor: pointer;
			left: 0;
			position: absolute;
			right: 0;
			top: 0;
			transition: .4s;
			border-radius: 34px;
		}

		.slider:before {
			background-color: var(--bart-white);
			bottom: 4px;
			content: "";
			height: 26px;
			left: 4px;
			position: absolute;
			transition: .4s;
			width: 26px;
			border-radius: 50%;
		}

		.switch {

			visibility: hidden;
			z-index: 100;
			border-radius: 8px;
		}

		#snackbar.show {

		}

			border-top-color: #fff;
			display: none;

		#map-overlay {

			top: 0;

		#map-overlay,

			position: absolute;
			top: 0;

		function showSnackbar(message) {
			const snackbar = document.getElementById('snackbar')
			snackbar.textContent = message

		function calculateDistance(lat1, lon1, lat2, lon2) {
			const R = 6371
			const dLat = (lat2 - lat1) * Math.PI / 180
			const dLon = (lon2 - lon1) * Math.PI / 180
			const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
				Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
					Math.sin(dLon / 2) * Math.sin(dLon / 2)
			const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))
			return R * c
		}

		function findNearestStation(userLat, userLon) {
			const stations = stationsData.root.stations.station
			let nearest = null
			let minDist = Infinity
			stations.forEach((st) => {
				const dist = calculateDistance(
					userLat,
					userLon,
					st.gtfs_latitude,
					st.gtfs_longitude,
				)
				if (dist < minDist) {
					minDist = dist
					nearest = st
				}
			})
			return nearest
		}

		function showSkeletons() {
			const departuresDiv = document.getElementById('departures')
			departuresDiv.innerHTML = ''
			for (let i = 0; i < 5; i++) {
				const group = document.createElement('div')
				group.className = 'card-row skeleton-card'
				departuresDiv.appendChild(group)
			}
		}

		async function fetchAndRenderDepartures(station) {
			if (!station) return

			const stationObj = typeof station === 'string'
				? stationsData.root.stations.station.find((s) => s.abbr === station)
				: station

			if (!stationObj) return

			const departuresDiv = document.getElementById('departures')
			const isNorthbound = document.getElementById('direction-toggle').checked

			showSkeletons()

			try {
				// Using the 'dir' parameter from the docs to filter at the API level
				const dirParam = isNorthbound ? 'n' : 's'
				const apiUrl =
					`https://api.bart.gov/api/etd.aspx?cmd=etd&orig=${stationObj.abbr}&key=${API_KEY}&dir=${dirParam}&json=y`
				const response = await fetch(apiUrl)
				if (!response.ok) throw new Error('API request failed')
				const data = await response.json()

				let etdList = data.root.station[0].etd

				departuresDiv.innerHTML = ''
				if (!etdList || etdList.length === 0) {
					departuresDiv.innerHTML =
						'<div style="text-align:center; color:var(--bart-gray-dark); padding:20px;">No departures found for this direction.</div>'
					return
				}

				// Group by platform
				const platforms = {}
				etdList.forEach(dest => {
					// Get platform from first estimate as platforms are consistent per destination
					const plat = dest.estimate[0]?.platform || 'Unknown'
					if (!platforms[plat]) platforms[plat] = []
					platforms[plat].push(dest)
				})

				// Sort platforms numerically
				const sortedPlatformKeys = Object.keys(platforms).sort((a, b) => {
					const numA = parseInt(a)
					const numB = parseInt(b)
					return (isNaN(numA) || isNaN(numB)) ? a.localeCompare(b) : numA - numB
				})

				sortedPlatformKeys.forEach(platKey => {
					const header = document.createElement('div')
					header.className = 'platform-header'
					header.textContent = `Platform ${platKey}`
					departuresDiv.appendChild(header)

					platforms[platKey].forEach((dest) => {
						const row = document.createElement('div')
						row.className = 'card-row'
						row.style.borderLeftColor = dest.estimate[0].hexcolor

						const destSpan = document.createElement('div')
						destSpan.className = 'line-dest'
						destSpan.textContent = dest.destination

						const estContainer = document.createElement('div')
						estContainer.className = 'line-estimates'

						dest.estimate.forEach((est) => {
							const pill = document.createElement('span')
							pill.className = `est-pill ${
								est.minutes === 'Leaving' ? 'leaving' : ''
							}`
							pill.textContent = est.minutes === 'Leaving' ? '0' : `${est.minutes}m`
							estContainer.appendChild(pill)
						})

						row.appendChild(destSpan)
						row.appendChild(estContainer)
						departuresDiv.appendChild(row)
					})
				})
			} catch (err) {
				departuresDiv.innerHTML = ''
				console.error(err)
			}
		}

		function resetLocationButton() {
			const btn = document.getElementById('btn-location')
			const btnText = document.getElementById('btn-text')
			const btnSpinner = document.getElementById('btn-spinner')
			btn.disabled = false
			btnText.style.display = 'block'
			btnSpinner.style.display = 'none'
		}

		function cancelGeolocation() {
			if (currentGeolocationWatchId !== null) {
				navigator.geolocation.clearWatch(currentGeolocationWatchId)
				currentGeolocationWatchId = null
			}
			activeGeoRequestId = null
			resetLocationButton()
		}

		function handleGeolocation() {
			if (!navigator.geolocation) {
				showSnackbar('Geolocation not supported by your browser.')
				return
			}

			const btn = document.getElementById('btn-location')
			const btnText = document.getElementById('btn-text')
			const btnSpinner = document.getElementById('btn-spinner')

			btn.disabled = true
			btnText.style.display = 'none'
			btnSpinner.style.display = 'block'

			const requestId = Date.now()
			activeGeoRequestId = requestId

			navigator.geolocation.getCurrentPosition(
				(pos) => {
					if (activeGeoRequestId !== requestId) return

					const station = findNearestStation(
						pos.coords.latitude,
						pos.coords.longitude,
					)
					const stationSelect = document.getElementById('station-select')
					stationSelect.value = station.abbr
					localStorage.setItem('lastStation', station.abbr)
					fetchAndRenderDepartures(station)
					resetLocationButton()
				},
				(err) => {
					if (activeGeoRequestId !== requestId) return

					resetLocationButton()
					showSnackbar('Unable to retrieve location. Please select a station.')
				},
				{ timeout: 10000 },
			)
		}

		function initMap() {
			const overlay = document.getElementById('map-overlay')
			const toggleBtn = document.getElementById('btn-map-toggle')
			const viewport = document.getElementById('map-viewport')
			const img = document.getElementById('system-map')

			let scale = 1, posX = 0, posY = 0
			let isDragging = false, startX, startY

			function updateTransform() {
				img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`
			}

			toggleBtn.onclick = () => {
				const isVisible = overlay.style.display === 'block'
				if (isVisible) {
					overlay.style.display = 'none'
				} else {
					scale = 1
					posX = 0
					posY = 0
					updateTransform()
					overlay.style.display = 'block'
				}
			}

			viewport.onmousedown = (e) => {
				isDragging = true
				startX = e.clientX - posX
				startY = e.clientY - posY
			}
			window.onmousemove = (e) => {
				if (!isDragging) return
				posX = e.clientX - startX
				posY = e.clientY - startY

				const viewW = viewport.clientWidth
				const viewH = viewport.clientHeight
				const imgW = img.naturalWidth * scale
				const imgH = img.naturalHeight * scale

				if (imgW > viewW) {
					const limit = (imgW - viewW) / 2
					posX = Math.max(-limit, Math.min(limit, posX))
				} else posX = 0
				if (imgH > viewH) {
					const limit = (imgH - viewH) / 2
					posY = Math.max(-limit, Math.min(limit, posY))
				} else posY = 0

				updateTransform()
			}
			window.onmouseup = () => isDragging = false

			viewport.ontouchstart = (e) => {
				isDragging = true
				startX = e.touches[0].clientX - posX
				startY = e.touches[0].clientY - posY
			}
			viewport.ontouchmove = (e) => {
				if (e.touches.length === 2) return
				if (!isDragging) return
				posX = e.touches[0].clientX - startX
				posY = e.touches[0].clientY - startY

				const viewW = viewport.clientWidth
				const viewH = viewport.clientHeight
				const imgW = img.naturalWidth * scale
				const imgH = img.naturalHeight * scale

				if (imgW > viewW) {
					const limit = (imgW - viewW) / 2
					posX = Math.max(-limit, Math.min(limit, posX))
				} else posX = 0
				if (imgH > viewH) {
					const limit = (imgH - viewH) / 2
					posY = Math.max(-limit, Math.min(limit, posY))
				} else posY = 0

				updateTransform()
			}
			viewport.ontouchend = () => isDragging = false

			viewport.onwheel = (e) => {
				e.preventDefault()
				const delta = e.deltaY > 0 ? 0.9 : 1.1
				scale *= delta
				scale = Math.min(Math.max(0.5, scale), 4)

				const viewW = viewport.clientWidth
				const viewH = viewport.clientHeight
				const imgW = img.naturalWidth * scale
				const imgH = img.naturalHeight * scale
				if (imgW > viewW) {
					const limit = (imgW - viewW) / 2
					posX = Math.max(-limit, Math.min(limit, posX))
				} else posX = 0
				if (imgH > viewH) {
					const limit = (imgH - viewH) / 2
					posY = Math.max(-limit, Math.min(limit, posY))
				} else posY = 0

				updateTransform()
			}

			let initialDist = 0
			viewport.ontouchmove = (e) => {
				if (e.touches.length === 2) {
					const dist = Math.hypot(
						e.touches[0].clientX - e.touches[1].clientX,
						e.touches[0].clientY - e.touches[1].clientY,
					)
					if (initialDist > 0) {
						const delta = dist / initialDist
						scale *= delta
						scale = Math.min(Math.max(0.5, scale), 4)

						const viewW = viewport.clientWidth
						const viewH = viewport.clientHeight
						const imgW = img.naturalWidth * scale
						const imgH = img.naturalHeight * scale
						if (imgW > viewW) {
							const limit = (imgW - viewW) / 2
							posX = Math.max(-limit, Math.min(limit, posX))
						} else posX = 0
						if (imgH > viewH) {
							const limit = (imgH - viewH) / 2
							posY = Math.max(-limit, Math.min(limit, posY))
						} else posY = 0

						updateTransform()
					}
					initialDist = dist
				} else if (isDragging) {
					posX = e.touches[0].clientX - startX
					posY = e.touches[0].clientY - startY

					const viewW = viewport.clientWidth
					const viewH = viewport.clientHeight
					const imgW = img.naturalWidth * scale
					const imgH = img.naturalHeight * scale
					if (imgW > viewW) {
						const limit = (imgW - viewW) / 2
						posX = Math.max(-limit, Math.min(limit, posX))
					} else posX = 0
					if (imgH > viewH) {
						const limit = (imgH - viewH) / 2
						posY = Math.max(-limit, Math.min(limit, posY))
					} else posY = 0

					updateTransform()
				}
			}
			viewport.ontouchend = () => {
				isDragging = false
				initialDist = 0
			}
		}

		function init() {
			const stationSelect = document.getElementById('station-select')
			const directionToggle = document.getElementById('direction-toggle')
			const directionLabel = document.getElementById('direction-label')
			const stations = stationsData.root.stations.station

			stations.forEach((st) => {
				const opt = document.createElement('option')
				opt.value = st.abbr
				opt.textContent = st.name
				stationSelect.appendChild(opt)
			})

			stationSelect.onchange = () => {
				cancelGeolocation()
				const selected = stations.find((s) => s.abbr === stationSelect.value)
				if (selected) {
					localStorage.setItem('lastStation', selected.abbr)
					fetchAndRenderDepartures(selected)
				}
			}

			directionToggle.onchange = () => {
				cancelGeolocation()
				directionLabel.textContent = directionToggle.checked
					? 'Northbound'
					: 'Southbound'
				const selected = stations.find((s) => s.abbr === stationSelect.value)
				if (selected) fetchAndRenderDepartures(selected)
			}

			document.getElementById('btn-location').onclick = handleGeolocation

			const savedStationAbbr = localStorage.getItem('lastStation')
			if (savedStationAbbr) {
				const savedStation = stations.find((s) => s.abbr === savedStationAbbr)
				if (savedStation) {
					stationSelect.value = savedStation.abbr
					fetchAndRenderDepartures(savedStation)
				}
			} else {
				const defaultStation = stations.find((s) => s.abbr === 'SFIA')
				if (defaultStation) {
					stationSelect.value = defaultStation.abbr
					fetchAndRenderDepartures(defaultStation)
				}
			}

			initMap()
		}

		window.onload = init
		</script>
